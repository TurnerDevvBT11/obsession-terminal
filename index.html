<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; overflow: hidden; }
        .hidden { display: none !important; }
        input { display: block; margin: 10px auto; padding: 10px; background: #000; border: 1px solid #0f0; color: #0f0; text-align: center; }
        button { background: #000; color: #0f0; padding: 15px 30px; font-size: 18px; border: 2px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        a { color: #0f0; display: block; margin: 20px; font-size: 24px; text-decoration: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>SYSTEM_ACCESS_REQUIRED</h1>
        <input type="text" id="user" placeholder="USERNAME">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button onclick="checkLogin()">LOGIN</button>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <div id="main-screen" class="hidden">
        <h1>SYSTEM_ACCESS_GRANTED</h1>
        <button onclick="startDrain()">EXECUTE_DRAIN</button>
    </div>

    <div id="socials-screen" class="hidden">
        <h1>ACCESS_COMPLETE</h1>
        <div id="links">
            <a href="https://www.tiktok.com/@devv1763?_r=1&_t=ZN-98TSYcxOdJm" target="_blank">>>> TIKTOK</a>
            <a href="https://www.instagram.com/devv1763_?igsh=dnZpNDdndHJhMHN4" target="_blank">>>> INSTAGRAM</a>
            <a href="https://on.soundcloud.com/ZRibs50bwGnRhCCDb5" target="_blank">>>> SOUNDCLOUD</a>
        </div>
    </div>

    <script>
        // 1. Preload audio as soon as the page loads so it plays instantly when clicked
        var drainSound = new Audio('https://github.com/TurnerDevvBT11/obsession-terminal/raw/main/Forever%20by%20the%20little%20dippers%20(Instrumental%20version)%20-%20I%20just%20a%20comment%20guy%20don%27t%20ask%20me%20(youtube).mp3');

        // 2. Stop audio when any link is clicked
        const allLinks = document.querySelectorAll('a');
        allLinks.forEach(link => {
            link.addEventListener('click', () => {
                drainSound.pause();
                drainSound.currentTime = 0;
            });
        });

        function checkLogin() {
            var u = document.getElementById('user').value.toLowerCase();
            var p = document.getElementById('pass').value.toLowerCase();
            if (u === "devv" && p === "obsession") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            } else {
                document.getElementById('error-msg').innerText = "ACCESS_DENIED";
            }
        }

        function startDrain() {
            drainSound.play(); // This will now play instantly because it's already loaded
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('socials-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
