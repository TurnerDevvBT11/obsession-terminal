<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_LOCKED</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; padding-top: 50px; overflow: hidden; transition: background 0.5s, color 0.5s; }
        
        /* Red Alert Class */
        .red-alert, .red-alert * { color: #f00 !important; border-color: #f00 !important; }
        .red-alert { background: #200 !important; }

        /* CRT Scanline Effect */
        body::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none; }

        .hidden { display: none !important; }
        input { display: block; margin: 10px auto; padding: 10px; background: #000; border: 1px solid #0f0; color: #0f0; text-align: center; }
        button { background: #000; color: #0f0; padding: 15px 30px; font-size: 18px; border: 2px solid #0f0; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
        a { color: #0f0; display: block; margin: 20px; font-size: 24px; text-decoration: none; }
        
        #balance-display { font-size: 3em; margin: 20px 0; font-weight: bold; }
        #terminal-log { position: fixed; bottom: 10px; left: 10px; text-align: left; font-size: 12px; opacity: 0.7; z-index: 3; }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            100% { transform: translate(-2px, -2px); }
        }
        .glitch-active { animation: shake 0.1s infinite; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>SYSTEM_ACCESS_REQUIRED</h1>
        <input type="text" id="user" placeholder="USERNAME" onkeypress="if(event.key === 'Enter') document.getElementById('pass').focus()">
        <input type="password" id="pass" placeholder="PASSWORD" onkeypress="if(event.key === 'Enter') checkLogin()">
        <button onclick="checkLogin()">LOGIN</button>
        <p id="error-msg" style="color: red;"></p>
    </div>

    <div id="main-screen" class="hidden">
        <h1>ACCOUNT_ACCESS_GRANTED</h1>
        <div id="balance-display">$0.00</div>
        <button onclick="startDrain()">EXECUTE_DRAIN</button>
    </div>

    <div id="socials-screen" class="hidden">
        <h1>ACCESS_COMPLETE</h1>
        <div id="links">
            <a href="https://www.tiktok.com/@devv1763?_r=1&_t=ZN-98TSYcxOdJm" target="_blank">>>> TIKTOK</a>
            <a href="https://www.instagram.com/devv1763_?igsh=dnZpNDdndHJhMHN4" target="_blank">>>> INSTAGRAM</a>
            <a href="https://on.soundcloud.com/ZRibs50bwGnRhCCDb5" target="_blank">>>> SOUNDCLOUD</a>
        </div>
    </div>

    <div id="terminal-log">> SYSTEM READY...<br>> AWAITING INPUT...</div>

    <script>
        var drainSound = new Audio('https://github.com/TurnerDevvBT11/obsession-terminal/raw/main/Forever%20by%20the%20little%20dippers%20(Instrumental%20version)%20-%20I%20just%20a%20comment%20guy%20don%27t%20ask%20me%20(youtube).mp3');
        var currentBalance = 0;

        function log(msg) { document.getElementById('terminal-log').innerHTML += "<br>> " + msg; }

        function checkLogin() {
            var u = document.getElementById('user').value.toLowerCase();
            var p = document.getElementById('pass').value.toLowerCase();
            if (u === "devv" && p === "obsession") {
                currentBalance = (Math.random() * (9000000 - 1000000) + 1000000);
                document.getElementById('balance-display').innerText = "$" + currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                log("AUTH SUCCESS. BALANCE FOUND.");
            } else {
                document.getElementById('error-msg').innerText = "ACCESS_DENIED";
                log("INVALID CREDENTIALS.");
            }
        }

        function startDrain() {
            drainSound.play();
            // Trigger red state globally
            document.body.classList.add('glitch-active', 'red-alert');
            log("SECURITY BREACH! DRAIN INITIATED!");
            
            var drainInterval = setInterval(function() {
                currentBalance -= 85000;
                document.getElementById('balance-display').innerText = "$" + currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                if (currentBalance < 0) currentBalance = 0;
            }, 50);

            setTimeout(function() {
                clearInterval(drainInterval);
                document.getElementById('main-screen').classList.add('hidden');
                document.getElementById('socials-screen').classList.remove('hidden');
            }, 1600);
        }
    </script>
</body>
</html>
