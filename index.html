<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #breach-msg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: red; opacity: 0; pointer-events: none; z-index: 999; }
        .flash { animation: blink 0.1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="breach-msg" class="hidden">YOU WONT GET AWAY WITH THIS</div>

    <div id="ui">
        <h1 id="status">INITIALIZING...</h1>
        <div id="login" class="hidden">
            <input id="user" type="text" placeholder="USER"><br>
            <input id="pass" type="password" placeholder="PASS"><br>
            <button onclick="login()">LOGIN</button>
        </div>
        <div id="main" class="hidden">
            <button onclick="drain()">EXECUTE_DRAIN</button>
        </div>
    </div>

    <script>
        setTimeout(() => { 
            document.getElementById('status').classList.add('hidden'); 
            document.getElementById('login').classList.remove('hidden'); 
        }, 1000);

        let attempts = 0;
        function login() {
            let u = document.getElementById('user').value;
            let p = document.getElementById('pass').value;
            if (u === "devv" && p === "obsession") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('main').classList.remove('hidden');
            } else {
                if(++attempts === 1) { 
                    document.getElementById('user').value = "WE_ARE_ALWAYS_WATCHING"; 
                    document.getElementById('user').disabled = true; 
                }
                alert("ACCESS DENIED");
            }
        }

        function drain() {
            document.body.style.background = "#220";
            let msg = document.getElementById('breach-msg');
            msg.classList.remove('hidden');
            msg.classList.add('flash');
        }
    </script>
</body>
</html>
