<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_LOCKED</title>
    <link href="https://fonts.googleapis.com/css2?family=Grape+Nuts&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background 0.5s, color 0.5s; overflow: hidden; cursor: crosshair; }
        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }
        #content-wrapper { position: relative; z-index: 2; width: 100%; transition: 0.3s; }
        
        /* Red Alert Theme Triggered by Class */
        body.red-alert { background: #220000 !important; color: #f00 !important; border: 10px solid #f00; animation: strobe 0.5s infinite; box-sizing: border-box; }
        body.red-alert button, body.red-alert a { border-color: #f00 !important; color: #f00 !important; }
        body.red-alert button:hover, body.red-alert a:hover { background: #f00 !important; color: #000 !important; }
        body.red-alert input { border-color: #f00 !important; color: #f00 !important; }

        @keyframes strobe { 0% { border-color: #f00; } 50% { border-color: transparent; } 100% { border-color: #f00; } }
        
        #crt-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 10; }
        .hidden { display: none !important; }
        input { display: block; margin: 10px auto; padding: 10px; background: #000; border: 1px solid #0f0; color: #0f0; text-align: center; }
        
        /* Default Buttons (Green/Black) */
        button, #socials-screen a { background: #000; color: #0f0; padding: 15px 30px; font-size: 18px; border: 2px solid #0f0; cursor: pointer; font-weight: bold; text-decoration: none; display: block; width: fit-content; margin: 20px auto; transition: 0.2s; }
        button:hover, #socials-screen a:hover { background: #0f0; color: #000; }
        
        #socials-screen h1 { color: #f00; }
        #balance-display { font-size: 3em; margin: 20px 0; font-weight: bold; }
        
        #progress-bar { width: 300px; height: 20px; border: 1px solid #0f0; margin: 10px auto; }
        #progress-fill { height: 100%; background: #0f0; width: 0%; transition: 0.3s; }
        
        #terminal-log { position: fixed; bottom: 10px; left: 10px; text-align: left; font-size: 12px; opacity: 0.7; z-index: 5; max-width: 400px; }
        #terminal-log a { display: inline; color: #030; text-decoration: none; }
        
        #obsession-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 8vw; color: #f00; z-index: 0; pointer-events: none; animation: flicker-glitch 3s infinite; font-family: 'Grape Nuts', cursive; font-weight: bold; }
        @keyframes flicker-glitch { 0%, 100% { opacity: 0.2; } 5% { opacity: 0.5; } 10% { opacity: 0.1; } }
        .glitch-active { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, -2px); } }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="crt-overlay"></div>

    <div id="content-wrapper">
        <div id="login-screen">
            <h1 id="boot-text">INITIALIZING...</h1>
            <div id="login-fields" class="hidden">
                <input type="text" id="user" placeholder="USERNAME" onkeypress="if(event.key === 'Enter') document.getElementById('pass').focus()">
                <input type="password" id="pass" placeholder="PASSWORD" onkeypress="if(event.key === 'Enter') checkLogin()">
                <button onclick="checkLogin()">LOGIN</button>
                <div id="progress-bar"><div id="progress-fill"></div></div>
                <p id="error-msg" style="color: red;"></p>
            </div>
        </div>

        <div id="main-screen" class="hidden">
            <h1>ACCOUNT_ACCESS_GRANTED</h1>
            <div id="balance-display">$0.00</div>
            <button onclick="startDrain()">EXECUTE_DRAIN</button>
        </div>

        <div id="socials-screen" class="hidden">
            <div id="obsession-bg">OBSESSION_ ACCESS_COMPLETE</div>
            <h1 style="z-index: 2; position: relative;">ACCESS_COMPLETE</h1>
            <div id="links" style="z-index: 2; position: relative;">
                <a href="https://www.tiktok.com/@devv1763?_r=1&_t=ZN-98TSYcxOdJm" target="_blank">>>> TIKTOK</a>
                <a href="https://www.instagram.com/devv1763_?igsh=dnZpNDdndHJhMHN4" target="_blank">>>> INSTAGRAM</a>
                <a href="https://on.soundcloud.com/ZRibs50bwGnRhCCDb5" target="_blank">>>> SOUNDCLOUD</a>
            </div>
            <button onclick="location.reload()" style="position: relative; z-index: 20;">DRAIN_MORE</button>
        </div>
    </div>

    <div id="terminal-log">
        > SYSTEM READY...<br>
        > <a href="https://youtu.be/roPQ_M3yJTA?si=RGhwpRc6aMNhwP0X" target="_blank">SYS_LOG_0123</a>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, drops, matrixColor = '#0f0';
        let isLoggedIn = false;

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; drops = Array(Math.floor(width / 20)).fill(1); }
        window.onresize = resize; resize();

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = matrixColor; ctx.font = '15px monospace';
            drops.forEach((y, i) => { ctx.fillText(Math.random() > 0.5 ? '1' : '0', i * 20, y * 20); if (y * 20 > height && Math.random() > 0.975) drops[i] = 0; drops[i]++; });
        }
        setInterval(drawMatrix, 50);

        setTimeout(() => { document.getElementById('boot-text').classList.add('hidden'); document.getElementById('login-fields').classList.remove('hidden'); }, 3000);

        var drainSound = new Audio('https://github.com/TurnerDevvBT11/obsession-terminal/raw/main/Forever%20by%20the%20little%20dippers%20(Instrumental%20version)%20-%20I%20just%20a%20comment%20guy%20don%27t%20ask%20me%20(youtube).mp3');
        var currentBalance = 0;

        function checkLogin() {
            if (document.getElementById('user').value.toLowerCase() === "devv" && document.getElementById('pass').value.toLowerCase() === "obsession") {
                isLoggedIn = true;
                currentBalance = 5000000;
                document.getElementById('balance-display').innerText = "$" + currentBalance.toLocaleString();
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            }
        }

        function startDrain() {
            drainSound.play();
            matrixColor = '#f00';
            document.body.classList.add('glitch-active', 'red-alert');
            var drainInterval = setInterval(() => { currentBalance -= 85000; document.getElementById('balance-display').innerText = "$" + currentBalance.toLocaleString(); if (currentBalance < 0) currentBalance = 0; }, 50);
            setTimeout(() => { clearInterval(drainInterval); document.getElementById('main-screen').classList.add('hidden'); document.getElementById('socials-screen').classList.remove('hidden'); }, 1600);
        }
    </script>
</body>
</html>
